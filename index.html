<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="The Gutman family's journey, told through a multilingual journal, stories, photographs and places."
    />
    <meta name="theme-color" content="#173e35" />
    <title>Gutman's Life Journey</title>
    <link rel="icon" href="assets/logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <script src="vendor/lucide.min.js" defer></script>
    <script src="data.js" defer></script>
    <script src="content.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="header">
      <a class="brand" href="#home"
        ><img
          class="brand-logo"
          src="assets/logo.jpg"
          alt="Gutman's Life Journey original logo"
        /><span>GUTMAN'S<small>LIFE JOURNEY</small></span></a
      >
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="header-tools">
        <a
          class="icon-button follow-header"
          href="https://www.instagram.com/gutmanslifejourney/"
          target="_blank"
          rel="noopener noreferrer"
          title="Instagram"
          aria-label="Follow on Instagram"
          ><i data-lucide="instagram"></i></a
        ><button
          class="icon-button"
          id="random-top"
          title="Random story"
          aria-label="Random story"
        >
          <i data-lucide="shuffle"></i></button
        ><select id="language" aria-label="Language">
          <option value="en">EN</option>
          <option value="he">עב</option>
          <option value="es">ES</option></select
        ><button
          class="icon-button menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-label="Open menu"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer id="footer"></footer>
    <dialog id="reader" aria-labelledby="reader-title">
      <button
        class="icon-button close-reader"
        id="close-reader"
        aria-label="Close story"
      >
        <i data-lucide="x"></i>
      </button>
      <div id="reader-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
